# Deploy workflow - triggered by workflow_run after successful build
# This workflow has access to secrets but never executes untrusted code
# It only downloads and deploys pre-built artifacts from the build workflow
# Security: Fork code cannot access secrets as it only runs in build workflow
# Deploys to IPFS for all branches

name: Deploy

# Explicitly declare permissions
permissions:
  actions: read
  contents: read
  pull-requests: write
  statuses: write

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]

env:
  BUILD_PATH: 'blog-build'

# Prevent concurrent deployments to the same target
# This avoids the "multiple github-pages artifacts" error
concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy-ipfs:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      cid: ${{ steps.deploy.outputs.cid }}
    environment:
      name: 'ipfs-publish'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: blog-build-${{ github.event.workflow_run.id }}
          path: ${{ env.BUILD_PATH }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Create IPFS CAR from build
        uses: ipshipyard/ipfs-deploy-action@v3
        id: deploy
        with:
          path-to-deploy: ${{ env.BUILD_PATH }}
          github-token: ${{ github.token }}
          set-pr-comment: 'true'
          set-github-status: 'true'

      # Filebase unpacks and pins the CAR because of the import=car metadata
      - name: Upload CAR to Filebase
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FILEBASE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FILEBASE_SECRET_KEY }}
          AWS_REGION: us-east-1 # AWS CLI needs a region to sign; Filebase ignores it
          FILEBASE_BUCKET: ${{ secrets.FILEBASE_BUCKET }}
          CID: ${{ steps.deploy.outputs.cid }}
          CAR_PATH: ${{ steps.deploy.outputs.car-path }}
        run: |
          OBJECT_KEY="${GITHUB_REPOSITORY//\//-}-${GITHUB_SHA:0:7}-${CID}.car"
          aws --endpoint https://s3.filebase.com s3 cp \
            "$CAR_PATH" "s3://${FILEBASE_BUCKET}/${OBJECT_KEY}" \
            --metadata 'import=car'

  dnslink-update:
    runs-on: ubuntu-latest
    needs: deploy-ipfs
    if: |
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    environment:
      name: 'cf-dnslink'
      url: "https://blog-ipfs-tech.ipns.inbrowser.link/"
    steps:
      - name: Update DNSLink
        uses: ipshipyard/dnslink-action@v1
        with:
          cid: ${{ needs.deploy-ipfs.outputs.cid }}
          dnslink_domain: 'blog-ipfs-tech.dnslinks.ipshipyard.tech'
          cf_zone_id: ${{ secrets.CF_DNS_ZONE_ID }}
          cf_auth_token: ${{ secrets.CF_DNS_AUTH_TOKEN }}
          github_token: ${{ github.token }}
          set_github_status: true

  deploy-gh-pages:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: blog-build-${{ github.event.workflow_run.id }}
          path: blog-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: blog-build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
